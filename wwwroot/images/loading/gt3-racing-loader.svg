<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Cyan Glow Filters -->
    <filter id="gt3-glow-core" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.0" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="gt3-glow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ground Reflection Gradient -->
    <linearGradient id="gt3-refl-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#00d2ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <style>
    /* Multi-tier technical line-art styling matching reference engineering scan */
    .gt3-primary { fill: none; stroke: #00d2ff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; filter: url(#gt3-glow-core); }
    .gt3-aero { fill: rgba(0, 210, 255, 0.16); stroke: #00f0ff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; filter: url(#gt3-glow-soft); }
    .gt3-body-secondary { fill: none; stroke: #00b4d8; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.88; }
    .gt3-fine { fill: none; stroke: #0077b6; stroke-width: 1.0; stroke-linecap: round; opacity: 0.75; }
    .gt3-subtle-lines { fill: none; stroke: #005f8a; stroke-width: 0.8; stroke-dasharray: 4 4; opacity: 0.50; }
    .gt3-glass { fill: rgba(0, 210, 255, 0.08); stroke: #00d2ff; stroke-width: 1.8; }
    .gt3-ground { stroke: #00d2ff; stroke-width: 1.8; opacity: 0.80; filter: url(#gt3-glow-soft); }
    .gt3-refl { stroke: url(#gt3-refl-grad); fill: none; stroke-width: 1.4; opacity: 0.35; }
  </style>

  <!-- ======================================================== -->
  <!-- 1. ENGINEERING BLUEPRINT CONSTRUCTION ARCS & AXES        -->
  <!-- ======================================================== -->
  <g id="gt3-blueprint-guides">
    <!-- Ground Datum Line -->
    <line pathLength="1" x1="50" y1="380" x2="950" y2="380" class="gt3-ground ground-stroke" />
    <line pathLength="1" x1="100" y1="386" x2="900" y2="386" class="gt3-fine" style="stroke-dasharray: 6 5;" />
    
    <!-- Calibration Ticks along Ground Line -->
    <g class="gt3-fine">
      <line pathLength="1" x1="150" y1="380" x2="150" y2="385" />
      <line pathLength="1" x1="250" y1="380" x2="250" y2="385" />
      <line pathLength="1" x1="350" y1="380" x2="350" y2="385" />
      <line pathLength="1" x1="450" y1="380" x2="450" y2="385" />
      <line pathLength="1" x1="550" y1="380" x2="550" y2="385" />
      <line pathLength="1" x1="650" y1="380" x2="650" y2="385" />
      <line pathLength="1" x1="750" y1="380" x2="750" y2="385" />
      <line pathLength="1" x1="850" y1="380" x2="850" y2="385" />
    </g>

    <!-- Axle Datum Axes -->
    <line pathLength="1" x1="265" y1="130" x2="265" y2="400" class="gt3-subtle-lines" />
    <line pathLength="1" x1="755" y1="130" x2="755" y2="400" class="gt3-subtle-lines" />
    <line pathLength="1" x1="210" y1="335" x2="810" y2="335" class="gt3-subtle-lines" />

    <!-- Wheelbase Dimension Line with Arrows -->
    <line pathLength="1" x1="265" y1="410" x2="755" y2="410" class="gt3-fine" />
    <polygon points="265,410 277,406 277,414" fill="#00d2ff" />
    <polygon points="755,410 743,406 743,414" fill="#00d2ff" />
    <text x="510" y="424" fill="#00b4d8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="2">WHEELBASE 2,510 mm</text>

    <!-- Center of Gravity Marker -->
    <circle cx="495" cy="275" r="7" class="gt3-fine" />
    <line pathLength="1" x1="485" y1="275" x2="505" y2="275" class="gt3-fine" />
    <line pathLength="1" x1="495" y1="265" x2="495" y2="285" class="gt3-fine" />

    <!-- Aerodynamic Downforce Flow Arcs matching Reference Scan -->
    <path pathLength="1" d="M 180,95 C 320,75 580,85 780,220" class="gt3-subtle-lines" />
    <path pathLength="1" d="M 95,380 C 110,250 180,150 265,135" class="gt3-subtle-lines" />
    <path pathLength="1" d="M 640,140 C 720,160 840,220 910,340" class="gt3-subtle-lines" />
    <path pathLength="1" d="M 360,110 C 480,70 600,100 700,170" class="gt3-subtle-lines" />
  </g>

  <!-- ======================================================== -->
  <!-- 2. GT3 RACING WHEELS, CARBON ROTORS & MONOBLOC CALIPERS  -->
  <!-- ======================================================== -->
  <g id="gt3-wheels" class="gt3-wheel-group">
    <!-- REAR WHEEL ASSEMBLY (Center: 265, 335) -->
    <!-- Wide Racing Slick Tyre -->
    <circle cx="265" cy="335" r="58" class="gt3-primary" />
    <circle cx="265" cy="335" r="54" class="gt3-fine" />
    <!-- 18-inch GT3 Forged Rim Lip -->
    <circle cx="265" cy="335" r="44" class="gt3-primary" />
    <circle cx="265" cy="335" r="39" class="gt3-body-secondary" />
    <!-- 380mm Cross-Drilled Ventilated Carbon-Steel Brake Rotor -->
    <circle cx="265" cy="335" r="31" class="gt3-body-secondary" style="stroke-dasharray: 4 2;" />
    <circle cx="265" cy="335" r="22" class="gt3-fine" />
    <!-- Brake Rotor Drill Hole Accents -->
    <g class="gt3-fine" style="opacity: 0.7;">
      <circle cx="250" cy="328" r="1.2" fill="#00d2ff" />
      <circle cx="260" cy="318" r="1.2" fill="#00d2ff" />
      <circle cx="273" cy="318" r="1.2" fill="#00d2ff" />
      <circle cx="280" cy="328" r="1.2" fill="#00d2ff" />
      <circle cx="280" cy="342" r="1.2" fill="#00d2ff" />
      <circle cx="273" cy="352" r="1.2" fill="#00d2ff" />
      <circle cx="260" cy="352" r="1.2" fill="#00d2ff" />
      <circle cx="250" cy="342" r="1.2" fill="#00d2ff" />
    </g>
    <!-- Rear Brembo Monobloc Caliper (Trailing Edge: 9 o'clock) -->
    <path pathLength="1" d="M 234,320 C 232,335 234,350 239,360 L 247,357 C 244,348 243,337 245,325 Z" fill="rgba(0, 210, 255, 0.35)" stroke="#00f0ff" stroke-width="1.6" />
    <!-- Motorsport Center-Lock Wheel Nut -->
    <circle cx="265" cy="335" r="9" class="gt3-primary" />
    <polygon points="265,329 270,332 270,338 265,341 260,338 260,332" fill="#00d2ff" stroke="#ffffff" stroke-width="0.8" />
    <!-- Multi-Spoke GT3 Magnesium Rim Pattern -->
    <g class="gt3-fine">
      <line pathLength="1" x1="265" y1="291" x2="265" y2="379" />
      <line pathLength="1" x1="221" y1="335" x2="309" y2="335" />
      <line pathLength="1" x1="234" y1="304" x2="296" y2="366" />
      <line pathLength="1" x1="234" y1="366" x2="296" y2="304" />
      <line pathLength="1" x1="248" y1="295" x2="282" y2="375" />
      <line pathLength="1" x1="282" y1="295" x2="248" y2="375" />
      <line pathLength="1" x1="225" y1="318" x2="305" y2="352" />
      <line pathLength="1" x1="225" y1="352" x2="305" y2="318" />
    </g>

    <!-- FRONT WHEEL ASSEMBLY (Center: 755, 335) -->
    <!-- Wide Racing Slick Tyre -->
    <circle cx="755" cy="335" r="58" class="gt3-primary" />
    <circle cx="755" cy="335" r="54" class="gt3-fine" />
    <!-- 18-inch GT3 Forged Rim Lip -->
    <circle cx="755" cy="335" r="44" class="gt3-primary" />
    <circle cx="755" cy="335" r="39" class="gt3-body-secondary" />
    <!-- 390mm Massive Front Carbon-Steel Brake Rotor -->
    <circle cx="755" cy="335" r="33" class="gt3-body-secondary" style="stroke-dasharray: 4 2;" />
    <circle cx="755" cy="335" r="23" class="gt3-fine" />
    <!-- Drill Holes Pattern -->
    <g class="gt3-fine" style="opacity: 0.7;">
      <circle cx="740" cy="328" r="1.2" fill="#00d2ff" />
      <circle cx="750" cy="318" r="1.2" fill="#00d2ff" />
      <circle cx="763" cy="318" r="1.2" fill="#00d2ff" />
      <circle cx="770" cy="328" r="1.2" fill="#00d2ff" />
      <circle cx="770" cy="342" r="1.2" fill="#00d2ff" />
      <circle cx="763" cy="352" r="1.2" fill="#00d2ff" />
      <circle cx="750" cy="352" r="1.2" fill="#00d2ff" />
      <circle cx="740" cy="342" r="1.2" fill="#00d2ff" />
    </g>
    <!-- Massive Front 6-Piston Monobloc Caliper (Trailing Edge: 9 o'clock) -->
    <path pathLength="1" d="M 724,320 C 722,335 724,350 729,360 L 737,357 C 734,348 733,337 735,325 Z" fill="rgba(0, 210, 255, 0.35)" stroke="#00f0ff" stroke-width="1.6" />
    <!-- Center-Lock Wheel Nut -->
    <circle cx="755" cy="335" r="9" class="gt3-primary" />
    <polygon points="755,329 760,332 760,338 755,341 750,338 750,332" fill="#00d2ff" stroke="#ffffff" stroke-width="0.8" />
    <!-- Multi-Spoke GT3 Magnesium Rim Pattern -->
    <g class="gt3-fine">
      <line pathLength="1" x1="755" y1="291" x2="755" y2="379" />
      <line pathLength="1" x1="711" y1="335" x2="799" y2="335" />
      <line pathLength="1" x1="724" y1="304" x2="786" y2="366" />
      <line pathLength="1" x1="724" y1="366" x2="786" y2="304" />
      <line pathLength="1" x1="738" y1="295" x2="772" y2="375" />
      <line pathLength="1" x1="772" y1="295" x2="738" y2="375" />
      <line pathLength="1" x1="715" y1="318" x2="795" y2="352" />
      <line pathLength="1" x1="715" y1="352" x2="795" y2="318" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 3. MAIN GT3 RACING BODYWORK, COCKPIT & SPLITTER          -->
  <!-- ======================================================== -->
  <g id="gt3-bodywork">
    <!-- Authentic GT3 Silhouette Line matching Reference Image with pathLength for animation -->
    <path pathLength="1" 
          d="M 948,376
             L 920,376
             L 910,366
             C 898,342 884,328 858,320
             L 834,314
             C 828,284 810,256 786,246
             C 760,236 722,236 692,250
             C 674,258 662,274 656,295
             L 654,295
             L 648,272
             C 632,224 598,172 560,148
             C 524,126 478,122 422,132
             C 368,142 320,178 286,236
             L 282,248
             C 258,244 228,250 204,268
             C 182,283 170,308 168,336
             L 166,342
             L 132,342
             C 126,354 120,368 116,376
             L 95,376
             L 92,364
             L 112,360
             L 116,345
             C 122,322 136,304 158,288
             L 168,274
             C 186,254 212,240 242,232
             L 252,230
             C 260,210 274,192 295,176
             L 302,170
             C 336,145 378,126 428,116
             C 480,108 534,112 584,136
             C 628,160 660,200 682,242
             L 748,268
             C 778,282 804,296 848,312
             C 880,323 908,340 924,362
             L 936,372
             L 948,376 Z" 
          class="gt3-primary stroke-animate outline-stroke" />

    <!-- Extended Carbon Front Splitter with Vertical Endplate -->
    <path pathLength="1" d="M 885,380 L 958,380 L 964,364 L 950,364 L 944,374 L 880,374 Z" class="gt3-aero stroke-animate" />
    <line pathLength="1" x1="952" y1="366" x2="952" y2="378" class="gt3-primary" />

    <!-- Dual Aerodynamic Dive Planes / Canards on Bumper Cheek -->
    <!-- Lower Canard -->
    <path pathLength="1" d="M 890,354 C 912,351 930,357 940,364 L 936,367 C 924,360 908,356 888,358 Z" class="gt3-aero" />
    <!-- Upper Canard -->
    <path pathLength="1" d="M 878,336 C 898,333 916,339 924,346 L 920,349 C 910,343 894,338 876,341 Z" class="gt3-aero" />

    <!-- Front Bumper Radiator Duct & Slanted GT3 Headlight Cluster -->
    <path pathLength="1" d="M 848,306 C 876,304 904,316 918,336 L 900,338 C 888,324 868,316 846,316 Z" class="gt3-glass" />
    <circle cx="890" cy="326" r="4.5" fill="#00d2ff" />
    <circle cx="904" cy="332" r="3" fill="#ffffff" />
    <path pathLength="1" d="M 894,345 L 864,345 L 856,368 L 902,368 Z" fill="rgba(0, 210, 255, 0.12)" stroke="#00b4d8" stroke-width="1.2" />

    <!-- Front Fender Top Louvres / Wheel Arch Air Relief Vents -->
    <g class="gt3-body-secondary">
      <line pathLength="1" x1="742" y1="246" x2="768" y2="244" />
      <line pathLength="1" x1="738" y1="252" x2="772" y2="250" />
      <line pathLength="1" x1="734" y1="258" x2="776" y2="256" />
      <line pathLength="1" x1="732" y1="264" x2="774" y2="262" />
    </g>

    <!-- Hood Heat Extractor Ducts -->
    <path pathLength="1" d="M 690,246 C 720,244 755,254 780,266" class="gt3-body-secondary" />
    <line pathLength="1" x1="705" y1="252" x2="750" y2="264" class="gt3-fine" />

    <!-- Low GT3 Aerodynamic Side Skirt / Underfloor Rocker -->
    <path pathLength="1" d="M 328,370 L 694,370 L 696,378 L 326,378 Z" class="gt3-aero" />
    <line pathLength="1" x1="330" y1="374" x2="692" y2="374" class="gt3-fine" />

    <!-- Rear Flank Radiator Cooling Intake Scoop ahead of Rear Wheel -->
    <path pathLength="1" d="M 354,312 C 368,314 388,328 384,356 L 372,358 C 372,336 358,326 348,324 Z" class="gt3-aero" />

    <!-- Massive Rear Diffuser with 4 Vertical Aero Strakes -->
    <path pathLength="1" d="M 95,378 L 165,378 L 175,368 L 110,368 Z" class="gt3-aero" />
    <line pathLength="1" x1="100" y1="364" x2="110" y2="384" class="gt3-primary" />
    <line pathLength="1" x1="116" y1="364" x2="126" y2="384" class="gt3-primary" />
    <line pathLength="1" x1="132" y1="364" x2="142" y2="384" class="gt3-primary" />
    <line pathLength="1" x1="148" y1="364" x2="158" y2="384" class="gt3-primary" />
    <!-- Dual Exhaust Pipes -->
    <circle cx="120" cy="356" r="4.5" fill="#060709" stroke="#00f0ff" stroke-width="1.6" />
    <circle cx="134" cy="356" r="4.5" fill="#060709" stroke="#00f0ff" stroke-width="1.6" />
  </g>

  <!-- ======================================================== -->
  <!-- 4. GT3 COCKPIT, POLYCARBONATE WINDOWS & FIA ROLL CAGE    -->
  <!-- ======================================================== -->
  <g id="gt3-cockpit">
    <!-- Greenhouse Window Outline -->
    <path pathLength="1" 
          d="M 648,258 
             C 630,216 600,178 562,156 
             C 530,138 486,134 444,144 
             C 398,154 358,182 328,230 
             L 314,252 
             L 648,258 Z" 
          class="gt3-glass stroke-animate" />

    <!-- A-Pillar & B-Pillar Frames -->
    <line pathLength="1" x1="562" y1="156" x2="648" y2="258" class="gt3-primary" />
    <line pathLength="1" x1="452" y1="142" x2="448" y2="258" class="gt3-body-secondary" />

    <!-- Polycarbonate Sliding Inspection Vent -->
    <rect x="492" y="208" width="34" height="22" rx="2" class="gt3-fine" />
    <line pathLength="1" x1="509" y1="208" x2="509" y2="230" class="gt3-fine" />

    <!-- Visible GT3 FIA Roll Cage Geometry (X-Braces & Main Hoop) -->
    <g class="gt3-fine" style="stroke-dasharray: 6 3; stroke-width: 1.4;">
      <!-- Main Roll Hoop -->
      <line pathLength="1" x1="440" y1="146" x2="434" y2="258" />
      <!-- Rear Diagonal Strut -->
      <line pathLength="1" x1="442" y1="148" x2="330" y2="253" />
      <!-- A-Pillar Reinforcement Bar -->
      <line pathLength="1" x1="552" y1="160" x2="630" y2="258" />
      <!-- Door Intrusion X-Bracing -->
      <line pathLength="1" x1="448" y1="196" x2="618" y2="256" />
      <line pathLength="1" x1="448" y1="256" x2="618" y2="196" />
    </g>

    <!-- Aerodynamic Carbon Side View Mirror (Twin Stalk) -->
    <path pathLength="1" d="M 622,240 C 618,228 630,223 642,223 C 652,223 658,230 656,240 C 650,246 630,248 622,240 Z" class="gt3-aero" />
    <line pathLength="1" x1="626" y1="244" x2="630" y2="256" class="gt3-primary" />
    <line pathLength="1" x1="634" y1="244" x2="638" y2="256" class="gt3-primary" />

    <!-- Door Shutline -->
    <path pathLength="1" d="M 446,258 L 440,368" class="gt3-body-secondary" />
    <path pathLength="1" d="M 654,266 L 646,368" class="gt3-body-secondary" />
    <rect x="468" y="270" width="18" height="5" rx="2" class="gt3-fine" />
  </g>

  <!-- ======================================================== -->
  <!-- 5. PROMINENT GT3 SWAN-NECK REAR WING ASSEMBLY            -->
  <!-- ======================================================== -->
  <g id="gt3-swan-neck-wing" class="gt3-aero-group">
    <!-- Top-Mount Swan-Neck Pylons (Curving from Deck OVER to Wing Top) -->
    <!-- Forward Pylon -->
    <path pathLength="1" d="M 230,235 C 220,188 194,144 162,103 L 172,101 C 206,140 232,184 240,235 Z" class="gt3-aero stroke-animate" />
    <!-- Aft Pylon -->
    <path pathLength="1" d="M 250,235 C 242,196 220,156 194,116 L 202,114 C 228,152 250,192 258,235 Z" class="gt3-aero stroke-animate" />

    <!-- Massive GT3 Aerodynamic Vertical Endplate -->
    <polygon points="100,88 210,94 205,170 128,168 95,133" class="gt3-aero" style="stroke-width: 2.6;" />
    <line pathLength="1" x1="110" y1="103" x2="198" y2="108" class="gt3-fine" />
    <circle cx="125" cy="118" r="2.5" fill="#00d2ff" />
    <circle cx="178" cy="123" r="2.5" fill="#00d2ff" />

    <!-- Dual-Element Aerofoil Profile -->
    <path pathLength="1" d="M 100,103 C 135,101 172,105 210,114 L 208,120 C 172,112 135,108 100,110 Z" fill="#00f0ff" stroke="#ffffff" stroke-width="1.4" class="stroke-animate" />
    <!-- Gurney Flap on Trailing Edge -->
    <path pathLength="1" d="M 208,112 L 212,102 L 215,102 L 210,114 Z" fill="#ffffff" />
  </g>

  <!-- ======================================================== -->
  <!-- 6. GROUND REFLECTION (SUBTLE MIRRORED RECONSTRUCTION)    -->
  <!-- ======================================================== -->
  <g id="gt3-reflection" transform="translate(0, 760) scale(1, -1)">
    <use href="#gt3-wheels" class="gt3-refl" />
    <path pathLength="1" d="M 948,376 L 920,376 L 910,366 C 898,342 884,328 858,320 L 834,314 C 828,284 810,256 786,246 C 760,236 722,236 692,250 C 674,258 662,274 656,295 L 654,295 L 648,272 C 632,224 598,172 560,148 C 524,126 478,122 422,132 C 368,142 320,178 286,236 L 282,248 C 258,244 228,250 204,268 C 182,283 170,308 168,336 L 132,342" class="gt3-refl" />
  </g>
</svg>
