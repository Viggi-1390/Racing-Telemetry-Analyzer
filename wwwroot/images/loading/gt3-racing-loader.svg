<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Cyan Glow Filters -->
    <filter id="gt3-glow-core" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.0" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="gt3-glow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ground Reflection Gradient -->
    <linearGradient id="gt3-refl-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#00d2ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <style>
    /* Multi-tier technical line-art styling */
    .gt3-primary { fill: none; stroke: #00d2ff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; filter: url(#gt3-glow-core); }
    .gt3-aero { fill: rgba(0, 210, 255, 0.18); stroke: #00e5ff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; filter: url(#gt3-glow-soft); }
    .gt3-body-secondary { fill: none; stroke: #00b4d8; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
    .gt3-fine { fill: none; stroke: #0077b6; stroke-width: 1.0; stroke-linecap: round; opacity: 0.70; }
    .gt3-subtle-lines { fill: none; stroke: #005f8a; stroke-width: 0.8; stroke-dasharray: 4 4; opacity: 0.45; }
    .gt3-glass { fill: rgba(0, 210, 255, 0.08); stroke: #00d2ff; stroke-width: 1.8; }
    .gt3-ground { stroke: #00d2ff; stroke-width: 1.8; opacity: 0.75; filter: url(#gt3-glow-soft); }
    .gt3-refl { stroke: url(#gt3-refl-grad); fill: none; stroke-width: 1.4; opacity: 0.35; }
  </style>

  <!-- ======================================================== -->
  <!-- 1. ENGINEERING BLUEPRINT CONSTRUCTION ARCS & AXES        -->
  <!-- ======================================================== -->
  <g id="blueprint-guides">
    <!-- Ground Datum Line -->
    <line x1="50" y1="380" x2="950" y2="380" class="gt3-ground" />
    <line x1="100" y1="386" x2="900" y2="386" class="gt3-fine" style="stroke-dasharray: 6 5;" />
    
    <!-- Calibration Ticks along Ground Line -->
    <g class="gt3-fine">
      <line x1="150" y1="380" x2="150" y2="385" />
      <line x1="250" y1="380" x2="250" y2="385" />
      <line x1="350" y1="380" x2="350" y2="385" />
      <line x1="450" y1="380" x2="450" y2="385" />
      <line x1="550" y1="380" x2="550" y2="385" />
      <line x1="650" y1="380" x2="650" y2="385" />
      <line x1="750" y1="380" x2="750" y2="385" />
      <line x1="850" y1="380" x2="850" y2="385" />
    </g>

    <!-- Axle Datum Axes -->
    <line x1="260" y1="140" x2="260" y2="400" class="gt3-subtle-lines" />
    <line x1="750" y1="140" x2="750" y2="400" class="gt3-subtle-lines" />
    <line x1="220" y1="335" x2="790" y2="335" class="gt3-subtle-lines" />

    <!-- Wheelbase Dimension Line with Arrows -->
    <line x1="260" y1="410" x2="750" y2="410" class="gt3-fine" />
    <polygon points="260,410 272,406 272,414" fill="#00d2ff" />
    <polygon points="750,410 738,406 738,414" fill="#00d2ff" />
    <text x="505" y="424" fill="#00b4d8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="2">WHEELBASE 2,510 mm</text>

    <!-- Center of Gravity Marker -->
    <circle cx="490" cy="275" r="7" class="gt3-fine" />
    <line x1="480" y1="275" x2="500" y2="275" class="gt3-fine" />
    <line x1="490" y1="265" x2="490" y2="285" class="gt3-fine" />

    <!-- Aerodynamic Downforce Flow Arcs -->
    <path d="M 180,95 C 320,80 580,90 770,220" class="gt3-subtle-lines" />
    <path d="M 100,380 C 110,260 180,160 260,145" class="gt3-subtle-lines" />
    <path d="M 640,140 C 720,160 840,220 900,340" class="gt3-subtle-lines" />
  </g>

  <!-- ======================================================== -->
  <!-- 2. GT3 RACING WHEELS, CARBON ROTORS & MONOBLOC CALIPERS  -->
  <!-- ======================================================== -->
  <g id="gt3-wheels">
    <!-- REAR WHEEL ASSEMBLY (Center: 260, 335) -->
    <!-- Wide Racing Slick Tyre -->
    <circle cx="260" cy="335" r="62" class="gt3-primary" />
    <circle cx="260" cy="335" r="58" class="gt3-fine" />
    <!-- 18-inch GT3 Forged Rim Lip -->
    <circle cx="260" cy="335" r="46" class="gt3-primary" />
    <circle cx="260" cy="335" r="41" class="gt3-body-secondary" />
    <!-- 380mm Cross-Drilled Ventilated Carbon-Steel Brake Rotor -->
    <circle cx="260" cy="335" r="33" class="gt3-body-secondary" style="stroke-dasharray: 4 2;" />
    <circle cx="260" cy="335" r="23" class="gt3-fine" />
    <!-- Brake Rotor Drill Hole Accents -->
    <g class="gt3-fine" style="opacity: 0.6;">
      <circle cx="245" cy="328" r="1.2" fill="#00d2ff" />
      <circle cx="255" cy="318" r="1.2" fill="#00d2ff" />
      <circle cx="268" cy="318" r="1.2" fill="#00d2ff" />
      <circle cx="275" cy="328" r="1.2" fill="#00d2ff" />
      <circle cx="275" cy="342" r="1.2" fill="#00d2ff" />
      <circle cx="268" cy="352" r="1.2" fill="#00d2ff" />
      <circle cx="255" cy="352" r="1.2" fill="#00d2ff" />
      <circle cx="245" cy="342" r="1.2" fill="#00d2ff" />
    </g>
    <!-- Rear Brembo Monobloc Caliper (Trailing) -->
    <path d="M 228,320 C 226,335 228,350 233,360 L 241,357 C 238,348 237,337 239,325 Z" fill="rgba(0, 210, 255, 0.3)" stroke="#00e5ff" stroke-width="1.6" />
    <!-- Motorsport Center-Lock Wheel Nut -->
    <circle cx="260" cy="335" r="10" class="gt3-primary" />
    <polygon points="260,328 266,332 266,338 260,342 254,338 254,332" fill="#00d2ff" stroke="#ffffff" stroke-width="0.8" />
    <!-- Multi-Spoke GT3 Magnesium Rim Pattern -->
    <g class="gt3-fine">
      <line x1="260" y1="289" x2="260" y2="381" />
      <line x1="214" y1="335" x2="306" y2="335" />
      <line x1="227" y1="302" x2="293" y2="368" />
      <line x1="227" y1="368" x2="293" y2="302" />
      <line x1="242" y1="293" x2="278" y2="377" />
      <line x1="278" y1="293" x2="242" y2="377" />
      <line x1="218" y1="317" x2="302" y2="353" />
      <line x1="218" y1="353" x2="302" y2="317" />
    </g>

    <!-- FRONT WHEEL ASSEMBLY (Center: 750, 335) -->
    <!-- Wide Racing Slick Tyre -->
    <circle cx="750" cy="335" r="62" class="gt3-primary" />
    <circle cx="750" cy="335" r="58" class="gt3-fine" />
    <!-- 18-inch GT3 Forged Rim Lip -->
    <circle cx="750" cy="335" r="46" class="gt3-primary" />
    <circle cx="750" cy="335" r="41" class="gt3-body-secondary" />
    <!-- 390mm Massive Front Carbon-Steel Brake Rotor -->
    <circle cx="750" cy="335" r="35" class="gt3-body-secondary" style="stroke-dasharray: 4 2;" />
    <circle cx="750" cy="335" r="24" class="gt3-fine" />
    <!-- Drill Holes Pattern -->
    <g class="gt3-fine" style="opacity: 0.6;">
      <circle cx="735" cy="328" r="1.2" fill="#00d2ff" />
      <circle cx="745" cy="318" r="1.2" fill="#00d2ff" />
      <circle cx="758" cy="318" r="1.2" fill="#00d2ff" />
      <circle cx="765" cy="328" r="1.2" fill="#00d2ff" />
      <circle cx="765" cy="342" r="1.2" fill="#00d2ff" />
      <circle cx="758" cy="352" r="1.2" fill="#00d2ff" />
      <circle cx="745" cy="352" r="1.2" fill="#00d2ff" />
      <circle cx="735" cy="342" r="1.2" fill="#00d2ff" />
    </g>
    <!-- Massive Front 6-Piston Monobloc Caliper (Leading Edge) -->
    <path d="M 780,318 C 785,334 785,350 780,362 L 771,358 C 775,349 775,337 772,323 Z" fill="rgba(0, 210, 255, 0.3)" stroke="#00e5ff" stroke-width="1.6" />
    <!-- Center-Lock Wheel Nut -->
    <circle cx="750" cy="335" r="10" class="gt3-primary" />
    <polygon points="750,328 756,332 756,338 750,342 744,338 744,332" fill="#00d2ff" stroke="#ffffff" stroke-width="0.8" />
    <!-- Multi-Spoke GT3 Magnesium Rim Pattern -->
    <g class="gt3-fine">
      <line x1="750" y1="289" x2="750" y2="381" />
      <line x1="704" y1="335" x2="796" y2="335" />
      <line x1="717" y1="302" x2="783" y2="368" />
      <line x1="717" y1="368" x2="783" y2="302" />
      <line x1="732" y1="293" x2="768" y2="377" />
      <line x1="768" y1="293" x2="732" y2="377" />
      <line x1="708" y1="317" x2="792" y2="353" />
      <line x1="708" y1="353" x2="792" y2="317" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 3. MAIN GT3 RACING BODYWORK, COCKPIT & SPLITTER          -->
  <!-- ======================================================== -->
  <g id="gt3-bodywork">
    <!-- Unmistakable Aggressive GT3 Silhouette Line (Nose to Tail) -->
    <path d="M 945,376
             L 915,376
             L 905,366
             C 892,342 878,328 852,320
             L 830,314
             C 824,286 806,260 782,248
             C 756,238 718,238 688,252
             C 670,260 658,276 652,295
             L 650,295
             L 645,274
             C 630,228 596,176 558,152
             C 522,130 478,126 422,136
             C 368,145 320,180 286,238
             L 280,250
             C 256,246 226,252 202,270
             C 180,285 168,310 166,338
             L 165,342
             L 130,342
             C 124,354 118,368 115,376
             L 95,376
             L 92,366
             L 112,362
             L 116,345
             C 122,322 136,304 158,288
             L 168,274
             C 186,254 212,240 242,232
             L 252,230
             C 260,210 274,192 295,176
             L 302,170
             C 336,145 378,126 428,118
             C 480,110 534,114 582,138
             C 626,162 658,202 680,244
             L 745,270
             C 776,284 802,298 845,314
             C 876,325 904,342 920,364
             L 932,374
             L 945,376 Z" 
          class="gt3-primary" />

    <!-- Extended Carbon Front Splitter with Vertical Endplate -->
    <path d="M 885,380 L 955,380 L 960,366 L 948,366 L 942,374 L 880,374 Z" class="gt3-aero" />
    <line x1="950" y1="368" x2="950" y2="378" class="gt3-primary" />

    <!-- Dual Aerodynamic Dive Planes / Canards -->
    <!-- Lower Canard -->
    <path d="M 888,354 C 910,351 928,357 938,364 L 934,367 C 922,360 906,356 886,358 Z" class="gt3-aero" />
    <!-- Upper Canard -->
    <path d="M 876,336 C 896,333 914,339 922,346 L 918,349 C 908,343 892,338 874,341 Z" class="gt3-aero" />

    <!-- Front Bumper Radiator Duct & Headlight Enclosure -->
    <path d="M 845,308 C 872,306 900,318 915,338 L 896,340 C 884,326 864,318 844,318 Z" class="gt3-glass" />
    <circle cx="886" cy="328" r="4.5" fill="#00d2ff" />
    <circle cx="900" cy="334" r="3" fill="#ffffff" />
    <path d="M 890,345 L 860,345 L 852,368 L 898,368 Z" fill="rgba(0, 210, 255, 0.12)" stroke="#00b4d8" stroke-width="1.2" />

    <!-- Front Fender Top Louvres / Wheel Arch Air Relief Vents -->
    <g class="gt3-body-secondary">
      <line x1="738" y1="248" x2="764" y2="246" />
      <line x1="734" y1="254" x2="768" y2="252" />
      <line x1="730" y1="260" x2="772" y2="258" />
      <line x1="728" y1="266" x2="770" y2="264" />
    </g>

    <!-- Hood Heat Extractor Ducts -->
    <path d="M 685,248 C 715,246 750,256 775,268" class="gt3-body-secondary" />
    <line x1="700" y1="254" x2="745" y2="266" class="gt3-fine" />

    <!-- Low GT3 Aerodynamic Side Skirt / Underfloor Rocker -->
    <path d="M 324,370 L 688,370 L 690,378 L 322,378 Z" class="gt3-aero" />
    <line x1="326" y1="374" x2="686" y2="374" class="gt3-fine" />
    <!-- Rear Brake Cooling Air Intake Scoop on Rear Fender -->
    <path d="M 350,314 C 364,316 384,330 380,358 L 368,360 C 368,338 354,328 344,326 Z" class="gt3-aero" />

    <!-- Massive Rear Diffuser with 4 Vertical Aero Strakes -->
    <path d="M 95,378 L 165,378 L 175,370 L 110,370 Z" class="gt3-aero" />
    <line x1="100" y1="366" x2="110" y2="384" class="gt3-primary" />
    <line x1="116" y1="366" x2="126" y2="384" class="gt3-primary" />
    <line x1="132" y1="366" x2="142" y2="384" class="gt3-primary" />
    <line x1="148" y1="366" x2="158" y2="384" class="gt3-primary" />
    <!-- Dual Exhaust Pipes -->
    <circle cx="120" cy="358" r="4.5" fill="#060709" stroke="#00e5ff" stroke-width="1.6" />
    <circle cx="134" cy="358" r="4.5" fill="#060709" stroke="#00e5ff" stroke-width="1.6" />
  </g>

  <!-- ======================================================== -->
  <!-- 4. GT3 COCKPIT, POLYCARBONATE WINDOWS & FIA ROLL CAGE    -->
  <!-- ======================================================== -->
  <g id="gt3-cockpit">
    <!-- Greenhouse Window Outline -->
    <path d="M 645,260 
             C 628,218 598,180 560,158 
             C 528,140 484,136 442,146 
             C 396,156 356,184 326,232 
             L 312,254 
             L 645,260 Z" 
          class="gt3-glass" />

    <!-- A-Pillar & B-Pillar Frames -->
    <line x1="560" y1="158" x2="645" y2="260" class="gt3-primary" />
    <line x1="450" y1="144" x2="446" y2="260" class="gt3-body-secondary" />

    <!-- Polycarbonate Sliding Inspection Vent -->
    <rect x="490" y="210" width="34" height="22" rx="2" class="gt3-fine" />
    <line x1="507" y1="210" x2="507" y2="232" class="gt3-fine" />

    <!-- Visible GT3 FIA Roll Cage Geometry (X-Braces & Main Hoop) -->
    <g class="gt3-fine" style="stroke-dasharray: 6 3; stroke-width: 1.4;">
      <!-- Main Roll Hoop -->
      <line x1="438" y1="148" x2="432" y2="260" />
      <!-- Rear Diagonal Strut -->
      <line x1="440" y1="150" x2="328" y2="255" />
      <!-- A-Pillar Reinforcement Bar -->
      <line x1="550" y1="162" x2="628" y2="260" />
      <!-- Door Intrusion X-Bracing -->
      <line x1="446" y1="198" x2="615" y2="258" />
      <line x1="446" y1="258" x2="615" y2="198" />
    </g>

    <!-- Aerodynamic Carbon Side View Mirror (Twin Stalk) -->
    <path d="M 618,242 C 615,230 626,225 638,225 C 648,225 654,232 652,242 C 646,248 626,250 618,242 Z" class="gt3-aero" />
    <line x1="622" y1="246" x2="626" y2="258" class="gt3-primary" />
    <line x1="630" y1="246" x2="634" y2="258" class="gt3-primary" />

    <!-- Door Shutline -->
    <path d="M 444,260 L 438,368" class="gt3-body-secondary" />
    <path d="M 652,268 L 644,368" class="gt3-body-secondary" />
    <rect x="466" y="272" width="18" height="5" rx="2" class="gt3-fine" />
  </g>

  <!-- ======================================================== -->
  <!-- 5. PROMINENT GT3 SWAN-NECK REAR WING ASSEMBLY            -->
  <!-- ======================================================== -->
  <g id="gt3-swan-neck-wing">
    <!-- Top-Mount Swan-Neck Pylons (Curving from Deck OVER to Wing Top) -->
    <!-- Forward Pylon -->
    <path d="M 225,235 C 216,190 190,146 158,105 L 168,103 C 202,142 228,186 236,235 Z" class="gt3-aero" />
    <!-- Aft Pylon -->
    <path d="M 245,235 C 238,198 216,158 190,118 L 198,116 C 224,154 246,194 254,235 Z" class="gt3-aero" />

    <!-- Massive GT3 Aerodynamic Vertical Endplate -->
    <polygon points="100,90 205,96 200,172 125,170 95,135" class="gt3-aero" style="stroke-width: 2.6;" />
    <line x1="110" y1="105" x2="195" y2="110" class="gt3-fine" />
    <circle cx="125" cy="120" r="2.5" fill="#00d2ff" />
    <circle cx="175" cy="125" r="2.5" fill="#00d2ff" />

    <!-- Dual-Element Aerofoil Profile -->
    <path d="M 100,105 C 135,103 170,107 206,116 L 205,122 C 170,114 135,110 100,112 Z" fill="#00e5ff" stroke="#ffffff" stroke-width="1.4" />
    <!-- Gurney Flap on Trailing Edge -->
    <path d="M 204,114 L 208,104 L 211,104 L 206,116 Z" fill="#ffffff" />
  </g>

  <!-- ======================================================== -->
  <!-- 6. GROUND REFLECTION (SUBTLE MIRRORED RECONSTRUCTION)    -->
  <!-- ======================================================== -->
  <g id="gt3-reflection" transform="translate(0, 760) scale(1, -1)">
    <use href="#gt3-wheels" class="gt3-refl" />
    <path d="M 945,376 L 915,376 L 905,366 C 892,342 878,328 852,320 L 830,314 C 824,286 806,260 782,248 C 756,238 718,238 688,252 C 670,260 658,276 652,295 L 650,295 L 645,274 C 630,228 596,176 558,152 C 522,130 478,126 422,136 C 368,145 320,180 286,238 L 280,250 C 256,246 226,252 202,270 C 180,285 168,310 166,338 L 130,342" class="gt3-refl" />
  </g>
</svg>
